[project]
name = "fraud-service"
version = "0.1.0"
description = "Fraud-scoring notebook (pre-refactor)"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "scikit-learn",
    "joblib",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_service"]